events {
    worker_connections 1024;
}

http {
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name warehouse-riwu.onrender.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTP server (no SSL management needed since Render handles SSL)
    server {
        listen 443;
        server_name warehouse-riwu.onrender.com;  # Replace with your domain

        root /var/www/public;
        index index.php index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;  # Set HTTPS header
        }

        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
